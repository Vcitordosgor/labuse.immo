<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=block">
<style>
html,body{margin:0;width:2880px;height:1800px;overflow:hidden;background:#0A0C0B}
#app{position:absolute;inset:0;width:2880px;height:1800px;opacity:0}
#bird{position:absolute;left:0;top:0;width:240px;height:82px;transform-origin:120px 30px;overflow:visible}
#wm{position:absolute;left:0;right:0;top:1020px;text-align:center;font:700 150px/1 'Space Grotesk',sans-serif;letter-spacing:.04em;color:#E8EFEA;opacity:0}
#wm b{color:#4ADE80}
</style></head><body>
<img id="app" src="app-first.jpg">
<svg id="bird" viewBox="0 0 240 82" overflow="visible">
  <defs>
    <clipPath id="L"><rect x="-50" y="-100" width="170.6" height="300"/></clipPath>
    <clipPath id="R"><rect x="119.4" y="-100" width="170.6" height="300"/></clipPath>
  </defs>
  <g id="wl" clip-path="url(#L)"><path fill="#4ADE80" d="M2 15 C58 10 100 18 120 27 C140 18 182 10 238 15 C202 29 162 40 135 46 C127 49 122 53 120 60 C118 53 113 49 105 46 C78 40 38 29 2 15 Z"/></g>
  <g id="wr" clip-path="url(#R)"><path fill="#4ADE80" d="M2 15 C58 10 100 18 120 27 C140 18 182 10 238 15 C202 29 162 40 135 46 C127 49 122 53 120 60 C118 53 113 49 105 46 C78 40 38 29 2 15 Z"/></g>
</svg>
<div id="wm">LA<b>BUSE</b></div>
<script>
const W=2880,H=1800;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// position finale = oiseau de l'en-tête de l'app (capture 2x) : centre ≈ (69,53), largeur ≈ 58 px
const END={x:69,y:53,w:58};
// 0 → 1,3 s : vol d'arrivée · 1,3 → 1,7 s : il se pose (le vol s'amortit) · 1,7 → 2,2 s : immobile, LABUSE écrit
// 2,2 → 2,8 s : il redécolle et rejoint le logo de l'en-tête · 2,5 → 2,85 s : l'app apparaît
const SETTLE=1.7, TAKEOFF=2.2, FLIGHT=0.6;
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x);};
window.render=(t)=>{
  let cx,cy,w,amp;
  if(t<1.3){ const u=ease(t/1.3); cx=lerp(-300,W/2,u); cy=lerp(1250,760,u)+Math.sin(u*Math.PI)*-120; w=lerp(300,520,u); amp=34; }
  else if(t<TAKEOFF){ const d=1-smooth((t-1.3)/(SETTLE-1.3)); cx=W/2; cy=760+Math.sin((t-1.3)*4)*10*d; w=520; amp=34*d; }
  else { const v=clamp((t-TAKEOFF)/FLIGHT,0,1), u=ease(v); cx=lerp(W/2,END.x,u); cy=lerp(760,END.y,u); w=lerp(520,END.w,u); amp=26*Math.sin(Math.PI*v); }
  const f = t<1.3?3.4:2.6;
  const a = amp*Math.sin(2*Math.PI*f*t);
  const s=w/240;
  const bird=document.getElementById('bird');
  bird.style.transform=`translate(${cx-120}px,${cy-30}px) scale(${s})`;
  document.getElementById('wl').setAttribute('transform',`rotate(${-a} 120 30)`);
  document.getElementById('wr').setAttribute('transform',`rotate(${a} 120 30)`);
  const wo = t<1.45?0:(t<1.85?(t-1.45)/0.4:(t<TAKEOFF?1:Math.max(0,1-(t-TAKEOFF)/0.25)));
  document.getElementById('wm').style.opacity=wo;
  document.getElementById('app').style.opacity=clamp((t-2.5)/0.35,0,1);
};
</script></body></html>
